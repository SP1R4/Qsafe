name: Setup PQ deps
description: >
  Build and cache OpenSSL >= 3.2 (for the Argon2 EVP_KDF) and liboqs into a
  prefix under $HOME. The GitHub Ubuntu images ship OpenSSL 3.0 (no Argon2 KDF
  params) and no liboqs, so we build both from source once and cache them.
  First run ~6 min; cached runs restore in seconds. Ubuntu bills at 1x vs
  macOS 10x, which is why the CI/Hardening jobs run here instead of on macOS.

inputs:
  openssl-version:
    description: OpenSSL release to build (must be >= 3.2 for Argon2)
    default: "3.3.2"
  liboqs-version:
    description: liboqs git tag to build
    default: "0.15.0"
  prefix:
    description: Install prefix for both libraries
    default: /home/runner/pqdeps

outputs:
  prefix:
    description: Directory the libraries were installed into
    value: ${{ inputs.prefix }}

runs:
  using: composite
  steps:
    - name: Cache PQ deps (OpenSSL + liboqs)
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.prefix }}
        key: pqdeps-${{ runner.os }}-openssl${{ inputs.openssl-version }}-liboqs${{ inputs.liboqs-version }}-libdir2

    - name: Build OpenSSL + liboqs from source
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PQPREFIX: ${{ inputs.prefix }}
        OPENSSL_VERSION: ${{ inputs.openssl-version }}
        LIBOQS_VERSION: ${{ inputs.liboqs-version }}
      run: |
        set -euo pipefail
        mkdir -p "$PQPREFIX" /tmp/pqbuild
        cd /tmp/pqbuild

        # --- OpenSSL (shared, no tests/docs to keep the build short) ---
        # Fetched over TLS from the official GitHub release. A sha256 pin can be
        # added here once we want supply-chain enforcement on the CI toolchain.
        curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tgz
        tar xf openssl.tgz
        cd "openssl-${OPENSSL_VERSION}"
        # --libdir=lib pins the install dir to lib/ (OpenSSL otherwise picks
        # lib64/ on many x86-64 distros); consumers point -L/-rpath at
        # <prefix>/lib, so without this the built libcrypto lands in lib64/, the
        # loader falls back to the system OpenSSL 3.0, and Argon2 (3.2+) fetches
        # fail as "unsupported" at runtime.
        ./Configure --prefix="$PQPREFIX" --openssldir="$PQPREFIX/ssl" --libdir=lib shared no-tests
        make -j"$(nproc)"
        make install_sw
        cd /tmp/pqbuild

        # --- liboqs (shared lib only) ---
        git clone --depth 1 --branch "$LIBOQS_VERSION" https://github.com/open-quantum-safe/liboqs
        cmake -S liboqs -B liboqs/build \
          -DCMAKE_INSTALL_PREFIX="$PQPREFIX" \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DOQS_BUILD_ONLY_LIB=ON
        cmake --build liboqs/build --parallel "$(nproc)"
        cmake --install liboqs/build
