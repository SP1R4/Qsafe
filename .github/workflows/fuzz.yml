name: Fuzz

# Continuous fuzzing of the untrusted-input parsers (decrypt / inspect /
# dearmor). Runs daily and on changes to the parsing code or this workflow,
# persisting a corpus across runs via the cache so coverage accumulates. A
# crash makes the job fail and uploads the reproducing input as an artifact.

on:
  # Disabled on the qsafe-pq fork: this is a base-qsafe distribution/
  # platform workflow, not relevant to the PQ crypto layer. Kept as a
  # manual (workflow_dispatch) trigger so nothing auto-runs / goes red.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/google-chrome.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev cmake ninja-build clang

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: liboqs-install
          key: liboqs-0.12.0-${{ runner.os }}

      - name: Build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/liboqs-install"
          cmake --build liboqs/build
          cmake --install liboqs/build

      - name: Install liboqs
        run: |
          sudo cp -r liboqs-install/include/* /usr/local/include/
          sudo cp -r liboqs-install/lib/* /usr/local/lib/
          sudo ldconfig

      - name: Build fuzz targets
        run: make fuzz fuzz-vault fuzz-vault-dir FUZZ_CC=clang

      # Persist both corpora across runs: the unique key always misses, but the
      # restore-key prefix pulls the most recent corpus, and the new corpus is
      # saved at job end.
      - name: Restore corpora
        uses: actions/cache@v4
        with:
          path: |
            corpus
            corpus_vault
            corpus_vault_dir
          key: qsafe-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            qsafe-fuzz-corpus-

      - name: Fuzz (decrypt parser)
        env:
          ASAN_OPTIONS: detect_leaks=0
          DURATION: ${{ github.event.inputs.duration || '300' }}
        run: |
          mkdir -p corpus
          tests/fuzz_decrypt -max_len=8192 -max_total_time="$DURATION" \
            -print_final_stats=1 corpus

      - name: Fuzz (vault reader)
        env:
          ASAN_OPTIONS: detect_leaks=0
          DURATION: ${{ github.event.inputs.duration || '300' }}
        run: |
          mkdir -p corpus_vault
          # Seed from the frozen fixture container so the mutator starts from
          # real ciphertext at the harness's fixed (offset, capacity).
          cp tests/fixtures/vault/container.bin corpus_vault/ 2>/dev/null || true
          tests/fuzz_vault -max_len=300000 -max_total_time="$DURATION" \
            -print_final_stats=1 corpus_vault

      - name: Fuzz (vault directory parser)
        env:
          ASAN_OPTIONS: detect_leaks=0
          DURATION: ${{ github.event.inputs.duration || '300' }}
        run: |
          mkdir -p corpus_vault_dir
          tests/fuzz_vault_dir -max_len=4096 -max_total_time="$DURATION" \
            -print_final_stats=1 corpus_vault_dir

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
            leak-*
          if-no-files-found: ignore
