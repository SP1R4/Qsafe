name: Release

# Builds Qsafe binaries for Linux and macOS whenever a version tag is pushed
# (e.g. `git tag v5.0.0 && git push --tags`) and attaches them to the release.

on:
  # Disabled on the qsafe-pq fork: this is a base-qsafe distribution/
  # platform workflow, not relevant to the PQ crypto layer. Kept as a
  # manual (workflow_dispatch) trigger so nothing auto-runs / goes red.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # keyless cosign signing via OIDC
  attestations: write  # SLSA build provenance (gh attestation verify)

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Linux: build liboqs from source, OpenSSL from apt ---
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Drop preconfigured third-party apt sources (e.g. packages.microsoft.com)
          # that can return 403 and break `apt-get update`; we only need the
          # Ubuntu archives.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/google-chrome.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev cmake ninja-build

      - name: Build & install liboqs (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build liboqs/build
          sudo cmake --install liboqs/build
          sudo ldconfig

      # --- macOS: everything from Homebrew ---
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 liboqs

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Package
        run: |
          NAME="qsafe-${GITHUB_REF_NAME}-$(uname -s)-$(uname -m)"
          mkdir -p "dist/$NAME"
          cp qsafe age-plugin-qsafe README.md LICENSE CHANGELOG.md "dist/$NAME/"
          cp docs/qsafe.1 "dist/$NAME/" || true
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifact (keyless)
        run: |
          for f in *.tar.gz; do
            # Keyless: identity is the GitHub Actions OIDC token; verification
            # needs no pre-shared key (see README "Verifying releases").
            cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
          done

      # SLSA build provenance: a signed attestation binding the artifact to
      # this workflow, commit, and builder. Verify with:
      #   gh attestation verify qsafe-*.tar.gz --repo <owner>/Qsafe
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qsafe-${{ runner.os }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.cosign.bundle

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.cosign.bundle

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils coreutils grep
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build & install liboqs
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX=/mingw64
          cmake --build liboqs/build
          cmake --install liboqs/build

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Package
        run: |
          NAME="qsafe-${GITHUB_REF_NAME}-Windows-x86_64"
          mkdir -p "dist/$NAME"
          cp qsafe.exe age-plugin-qsafe.exe README.md LICENSE CHANGELOG.md "dist/$NAME/"
          cp docs/qsafe.1 "dist/$NAME/" || true
          # Bundle the MinGW runtime DLLs so the archive runs without MSYS2.
          ldd qsafe.exe age-plugin-qsafe.exe | grep -i '/mingw64/' | awk '{print $3}' | sort -u | while read -r dll; do
            [ -f "$dll" ] && cp "$dll" "dist/$NAME/"
          done
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifact (keyless)
        run: |
          for f in *.tar.gz; do
            cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qsafe-Windows
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.cosign.bundle

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.cosign.bundle
