name: CodeQL

# Dataflow static analysis of the C sources (incl. the PQ crypto: ratchet, pqxdh,
# crypto_utils). Results appear in the repo's Security tab.
#
# Uses CodeQL's buildless C/C++ extraction (build-mode: none): no compile step, so
# it sidesteps this fork's OpenSSL 3.2 (Argon2) requirement — absent from the GitHub
# Ubuntu images — and the CodeQL-extractor arch mismatch on Apple-Silicon runners.
# Runs natively on ubuntu-latest (fast, no dependency install).

on:
  push:
    branches: [feat/v8-advanced]
  pull_request:
  workflow_dispatch:       # manual re-trigger (push events can be dropped on non-default branches)
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read          # private repo: CodeQL reads workflow-run metadata when uploading SARIF

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
