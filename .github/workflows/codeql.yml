name: CodeQL

# Deep dataflow static analysis of the C sources (incl. the PQ crypto: ratchet,
# pqxdh, crypto_utils). Results appear in the repo's Security tab. C/C++ needs a
# real build, so we install deps + build with `make` between CodeQL init/analyze.
#
# Runs on macOS: this fork needs OpenSSL 3.2+ (Argon2 EVP_KDF), which the GitHub
# Ubuntu images lack, so the traced build fails there. We use macos-13 (Intel):
# CodeQL's C/C++ tracer builds x86_64, so an Apple-Silicon runner's arm64 Homebrew
# libs won't link — an x86_64 runner keeps compiler, libs, and extractor aligned.

on:
  push:
    branches: [feat/v8-advanced]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: macos-13   # Intel/x86_64 — matches CodeQL's C/C++ extractor arch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (OpenSSL 3.x + liboqs)
        run: brew install openssl@3 liboqs

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp

      - name: Build (traced by CodeQL)
        run: make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
