name: Bindings

# Builds the shared library (libqsafe) and runs the Python binding tests.

on:
  # Disabled on the qsafe-pq fork: this is a base-qsafe distribution/
  # platform workflow, not relevant to the PQ crypto layer. Kept as a
  # manual (workflow_dispatch) trigger so nothing auto-runs / goes red.
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/google-chrome.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev cmake ninja-build

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: liboqs-install
          key: liboqs-0.15.0-${{ runner.os }}

      - name: Build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.15.0 https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/liboqs-install"
          cmake --build liboqs/build
          cmake --install liboqs/build

      - name: Install liboqs
        run: |
          sudo cp -r liboqs-install/include/* /usr/local/include/
          sudo cp -r liboqs-install/lib/* /usr/local/lib/
          sudo ldconfig

      - name: Build libqsafe
        run: make lib

      - name: Run Python binding tests
        run: QSAFE_LIB="$PWD/libqsafe.so" python3 python/test_qsafe.py
