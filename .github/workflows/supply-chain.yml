name: Supply chain

# Assurance beyond correctness: the same source must produce byte-identical
# binaries (reproducible-build check), and the key-handling paths must not
# branch on secrets (ctgrind-style valgrind check).

on:
  push:
  pull_request:

jobs:
  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/google-chrome.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev cmake ninja-build

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: liboqs-install
          key: liboqs-0.12.0-${{ runner.os }}-repro

      - name: Build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/liboqs-install
          cmake --build liboqs/build
          cmake --install liboqs/build

      - name: Install liboqs
        run: |
          sudo cp -r liboqs-install/include/* /usr/local/include/
          sudo cp -r liboqs-install/lib/* /usr/local/lib/
          sudo ldconfig

      - name: Build twice, compare hashes
        run: |
          export SOURCE_DATE_EPOCH=0
          make CPPFLAGS="-Iinclude" 2>/dev/null || make
          sha256sum qsafe age-plugin-qsafe > first.sha256
          cat first.sha256
          make clean
          make
          sha256sum qsafe age-plugin-qsafe > second.sha256
          cat second.sha256
          diff first.sha256 second.sha256 \
            && echo "Build is reproducible" \
            || { echo "::error::binaries differ between identical builds"; exit 1; }

  constant-time:
    name: Constant-time check (ctgrind)
    runs-on: ubuntu-latest
    # Advisory until a clean baseline is established across the OpenSSL and
    # liboqs versions CI pins; flip to enforcing once it has run green for a
    # while. A failure here means valgrind saw a branch or memory index that
    # depends on secret data.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/google-chrome.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev cmake ninja-build valgrind

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: liboqs-install
          key: liboqs-0.12.0-${{ runner.os }}-repro

      - name: Build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/liboqs-install
          cmake --build liboqs/build
          cmake --install liboqs/build

      - name: Install liboqs
        run: |
          sudo cp -r liboqs-install/include/* /usr/local/include/
          sudo cp -r liboqs-install/lib/* /usr/local/lib/
          sudo ldconfig

      - name: Build harness
        run: make src/crypto_utils.o && make ct

      - name: Run under valgrind
        run: |
          valgrind --error-exitcode=1 --track-origins=yes \
            --show-error-list=yes tests/ct_check
