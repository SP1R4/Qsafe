name: Supply chain

# Assurance beyond correctness: the same source must produce byte-identical
# binaries (reproducible-build check), and the key-handling paths must not
# branch on secrets (ctgrind-style valgrind check).

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, for the deep constant-time sweep
  workflow_dispatch:

jobs:
  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/google-chrome.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev cmake ninja-build

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: liboqs-install
          key: liboqs-0.12.0-${{ runner.os }}-repro

      - name: Build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/liboqs-install
          cmake --build liboqs/build
          cmake --install liboqs/build

      - name: Install liboqs
        run: |
          sudo cp -r liboqs-install/include/* /usr/local/include/
          sudo cp -r liboqs-install/lib/* /usr/local/lib/
          sudo ldconfig

      - name: Build twice, compare hashes
        run: |
          # Both builds MUST use identical flags — build the default target the
          # same way each time (a flag difference here would be measuring the
          # flags, not reproducibility).
          export SOURCE_DATE_EPOCH=0
          make clean && make
          sha256sum qsafe age-plugin-qsafe > first.sha256
          cat first.sha256
          make clean && make
          sha256sum qsafe age-plugin-qsafe > second.sha256
          cat second.sha256
          if diff first.sha256 second.sha256; then
            echo "Build is reproducible"
          else
            echo "::error::binaries differ between identical builds"
            exit 1
          fi

  constant-time:
    name: Constant-time check (ctgrind)
    runs-on: ubuntu-latest
    # Deep, advisory check: valgrind over code that calls OpenSSL/liboqs needs a
    # curated suppressions file to filter those libraries' own vectorized-asm
    # false positives before it can run green. Until that baseline exists it is
    # NOT a per-PR gate — it runs on the weekly schedule and on demand
    # (workflow_dispatch), where the output is reviewed by a human.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/google-chrome.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev cmake ninja-build valgrind

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: liboqs-install
          key: liboqs-0.12.0-${{ runner.os }}-repro

      - name: Build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/liboqs-install
          cmake --build liboqs/build
          cmake --install liboqs/build

      - name: Install liboqs
        run: |
          sudo cp -r liboqs-install/include/* /usr/local/include/
          sudo cp -r liboqs-install/lib/* /usr/local/lib/
          sudo ldconfig

      - name: Build harness
        run: make src/crypto_utils.o && make ct

      - name: Run under valgrind
        run: |
          valgrind --error-exitcode=1 --track-origins=yes \
            --show-error-list=yes tests/ct_check
