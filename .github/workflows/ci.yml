name: CI

on:
  push:
  pull_request:

# qsafe-pq (the PQ messaging fork) builds against OpenSSL 3.2+ (Argon2 EVP_KDF) and
# liboqs. macOS runners provide both via Homebrew, matching the dev environment;
# the GitHub Ubuntu images still ship OpenSSL 3.0, whose headers lack the Argon2
# KDF params, so the build there fails independently of this fork's code.
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (OpenSSL 3.x + liboqs)
        run: brew install openssl@3 liboqs

      - name: Build (warnings are errors)
        run: make EXTRA_CFLAGS="-Werror"

      - name: Unit tests + ratchet / PQXDH / PQ-ratchet / soak suite
        run: make test
