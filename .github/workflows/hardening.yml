name: Hardening

# Memory-safety / undefined-behavior coverage beyond ci.yml: the full build +
# test suite (unit, ratchet, PQXDH, PQ-ratchet, soak) under AddressSanitizer +
# UndefinedBehaviorSanitizer.
#
# Runs on Ubuntu (1x billing vs macOS 10x). OpenSSL 3.2+ (Argon2 EVP_KDF) and
# liboqs are built from source and cached by the setup-pq-deps composite action.
# Two checks from the original upstream Ubuntu job stay dropped: Valgrind (ASan
# covers the same ground) and the libFuzzer smoke run (the wire-parser fuzzing
# lives in the veil repo's own deterministic ASan fuzzer).
on:
  push:
  pull_request:

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PQ deps (OpenSSL 3.2+ / liboqs)
        id: pq
        uses: ./.github/actions/setup-pq-deps

      - name: Build & test under ASan/UBSan
        env:
          # OpenSSL/liboqs one-time globals are not leaks we own; Linux has a
          # LeakSanitizer (unlike macOS) that would flag them, so disable it.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make clean
          make test \
            EXTRA_CFLAGS="-I${{ steps.pq.outputs.prefix }}/include -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g -O1" \
            EXTRA_LDFLAGS="-L${{ steps.pq.outputs.prefix }}/lib -Wl,-rpath,${{ steps.pq.outputs.prefix }}/lib -fsanitize=address,undefined"
