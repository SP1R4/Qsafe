name: Hardening

# Memory-safety / undefined-behavior coverage beyond ci.yml: the full build +
# test suite (unit, ratchet, PQXDH, PQ-ratchet, soak) under AddressSanitizer +
# UndefinedBehaviorSanitizer.
#
# Runs on macOS: this fork needs OpenSSL 3.2+ (Argon2 EVP_KDF) which the GitHub
# Ubuntu images lack. Two checks from the upstream Ubuntu job are intentionally
# dropped here: Valgrind (unsupported on current macOS/arm64 — ASan covers the
# same ground) and the libFuzzer smoke run (libFuzzer hangs on macOS/arm64; the
# wire-parser fuzzing lives in the veil repo's own deterministic ASan fuzzer).

on:
  push:
  pull_request:

jobs:
  hardening:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (OpenSSL 3.x + liboqs)
        run: brew install openssl@3 liboqs

      - name: Build & test under ASan/UBSan
        env:
          # Library one-time globals (OpenSSL/liboqs) are not leaks we own; macOS
          # ASan has no leak detector anyway.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make clean
          make test \
            EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g -O1" \
            EXTRA_LDFLAGS="-fsanitize=address,undefined"
